<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Login | Local ERP</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-page="login">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-header">
                <span class="brand-mark">INV</span>
                <div>
                    <p class="eyebrow">Secure Access</p>
                    <h1>System Login</h1>
                </div>
            </div>

            <form id="loginForm">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>

                <div id="error-msg" class="error-box hidden">Invalid credentials.</div>

                <button type="submit" class="primary-button auth-submit">Access System</button>
            </form>
        </div>
    </div>

    <script src="/static/app.js" defer></script>
</body>
</html>
